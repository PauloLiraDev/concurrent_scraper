name: Docker Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build and start containers
        run: docker compose up -d --build
      
      - name: Check running containers
        run: docker compose ps
      
      - name: Wait for application startup
        run: sleep 10
      
      - name: Run tests inside container
        run: docker compose exec -T api python -m src.run_tests
      
      - name: Check for Chrome orphaned processes
        run: docker compose exec -T api bash -c "ps aux | grep chrome | grep -v grep || echo 'No Chrome processes found'"
      
      - name: Collect logs
        if: always()
        run: docker compose logs > docker-logs.txt
      
      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: docker-logs
          path: docker-logs.txt
      
      - name: Shutdown containers
        if: always()
        run: docker compose down